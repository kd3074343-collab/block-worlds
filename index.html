<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2a">
<title>Block Worlds</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a2a;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:.85}
#cross::before,#cross::after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross::before{left:10px;top:2px;width:2px;height:18px}
#cross::after{left:2px;top:10px;width:18px;height:2px}
#cross.mob{opacity:1;filter:drop-shadow(0 0 3px #f33)}
#cross.mob::before,#cross.mob::after{background:#ff4040;mix-blend-mode:normal}
#wtr{position:absolute;inset:0;background:rgba(30,80,190,.38);opacity:0;transition:opacity .15s}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(200,0,0,0) 35%,rgba(200,0,0,.65) 100%);opacity:0;transition:opacity .35s}
#hurt.on{opacity:1;transition:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#mineBar{position:absolute;left:50%;top:calc(50% + 24px);width:72px;height:7px;margin-left:-36px;background:rgba(0,0,0,.55);border-radius:4px;overflow:hidden;display:none}
#mineBar i{display:block;height:100%;width:0;background:#fff}
#hot{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:3px;padding:4px;background:rgba(0,0,0,.45);border-radius:10px;pointer-events:auto}
.slot{position:relative;width:38px;height:38px;border-radius:6px;border:3px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);padding:0;display:grid;place-items:center}
.slot.on{border-color:#fff;background:rgba(255,255,255,.18)}
.slot canvas{width:26px;height:26px;image-rendering:pixelated}
.slot.empty canvas{opacity:.3}
.slot .n{position:absolute;right:1px;bottom:-1px;font-size:11px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000}
#stats{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));width:min(332px,94vw);display:flex;justify-content:space-between;font-size:14px;letter-spacing:-1px;text-shadow:0 0 3px #000;pointer-events:none}
#stats .h{color:#ef4444}#stats .f{color:#f0a63c}
#stats .half{opacity:.5}#stats .e{color:#352626}
.act{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.55);font-weight:700;display:grid;place-items:center;touch-action:none}
.act:active,.act.hold{background:rgba(255,255,255,.45)}
#bBreak{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:78px;height:78px;background:rgba(214,69,69,.45)}
#bPlace{right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:68px;height:68px;background:rgba(31,157,99,.45)}
#bJump{right:calc(52px + env(safe-area-inset-right,0px));bottom:calc(172px + env(safe-area-inset-bottom,0px));width:66px;height:66px}
#bDown{right:calc(126px + env(safe-area-inset-right,0px));bottom:calc(172px + env(safe-area-inset-bottom,0px));width:56px;height:56px;display:none}
#joyBase{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
#joyKnob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.4)}
.lefty #bBreak{right:auto;left:calc(14px + env(safe-area-inset-left,0px))}
.lefty #bPlace{right:auto;left:calc(100px + env(safe-area-inset-left,0px))}
.lefty #bJump{right:auto;left:calc(52px + env(safe-area-inset-left,0px))}
.lefty #bDown{right:auto;left:calc(126px + env(safe-area-inset-left,0px))}
.lefty #joyBase{left:auto;right:calc(26px + env(safe-area-inset-right,0px))}
.round{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);font-size:20px;pointer-events:auto}
#menuBtn{right:calc(10px + env(safe-area-inset-right,0px))}
#invBtn{right:calc(62px + env(safe-area-inset-right,0px))}
#tip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:7px 14px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .25s;max-width:70vw;text-align:center}
#tip.show{opacity:1}
#menu,#inv,#furn,#chest,#set,#dead,#load{position:fixed;inset:0;z-index:10;background:rgba(6,14,24,.9);display:none;align-items:center;justify-content:center;padding:16px}
#menu.show,#inv.show,#furn.show,#chest.show,#set.show,#dead.show,#load.show{display:flex}
#dead{background:rgba(90,0,0,.85);z-index:12;text-align:center}
.panel{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto;touch-action:pan-y}
.panel h1{margin:0 0 2px;font-size:24px}
.panel h2{margin:8px 0 0;font-size:16px;color:#9fd8b8}
.panel p{margin:0;color:#b9c7d6;font-size:14px;line-height:1.45}
.mb{padding:14px;border-radius:12px;background:#1f9d63;font-weight:700;font-size:16px}
.mb.alt{background:#2b3f55}.mb.red{background:#a23b3b}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:12px 4px;border-radius:10px;background:#2b3f55;font-weight:700;font-size:14px}
.seg button.on{background:#1f9d63}
input[type=range]{width:100%;touch-action:auto;accent-color:#1f9d63}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{position:relative;background:#22364b;border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;text-align:center}
.card canvas{width:34px;height:34px;image-rendering:pixelated}
.card .q{font-weight:700;font-size:13px}
.rec{display:flex;align-items:center;gap:10px;background:#22364b;border-radius:10px;padding:8px 10px}
.rec canvas{width:30px;height:30px;image-rendering:pixelated;flex:none}
.rec .t{flex:1;font-size:14px}.rec small{display:block;color:#9fb2c6;font-size:12px}
.rec button{padding:9px 14px;border-radius:10px;background:#1f9d63;font-weight:700}
.rec button:disabled{background:#3a4a5b;color:#8a99a8}
#load{background:#0b1a2a;flex-direction:column;gap:12px;text-align:center}
#bar{width:220px;height:8px;border-radius:4px;background:#26384c;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#4cc38a}
#mpScreen{position:fixed;inset:0;z-index:40;background:rgba(5,13,24,.97);display:flex;align-items:center;justify-content:center;padding:18px;color:#fff}
#mpScreen[hidden]{display:none!important}
.mpPanel{width:min(100%,440px);max-height:92dvh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;touch-action:pan-y}
.mpPanel h1{margin:0;font-size:27px}
.mpPanel p{margin:0;color:#b9c7d6;font-size:14px;line-height:1.45}
.mpWelcomeLine{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;white-space:nowrap;text-align:center}.mpWelcomeLine .mpWelcomeLabel{color:#b9c7d6}.mpWelcomeLine .mpUserName{font-weight:800;color:#fff}.mpEditName{border-radius:6px!important;background:rgba(255,255,255,.08)!important;padding:3px 5px!important;font-size:14px!important}
.mpEditName{border:0;background:transparent;color:#fff;font-size:16px;padding:2px 5px;line-height:1;cursor:pointer}
.mpBtn{box-sizing:border-box;border-radius:12px;padding:14px 12px;background:#1f9d63;font-weight:800;font-size:16px;text-align:center;width:100%;display:block;align-self:center;margin:0 auto}
.mpBtn.alt{background:#2b3f55}.mpBtn.red{background:#a23b3b}
.mpInput{width:100%;padding:13px;border-radius:10px;background:#172a3d;border:1px solid #466079;color:#fff;font:inherit;touch-action:auto}
.mpCard{background:#172a3d;border:1px solid #314b64;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mpStatus{color:#9fe5bd;font-size:13px;min-height:18px;white-space:pre-wrap}
#mpPlayersHud{position:fixed;z-index:4;left:8px;top:58px;max-width:45vw;pointer-events:none;font-size:12px;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.35);border-radius:8px;padding:5px 8px;display:none}
#mpNames{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
#mpPing{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(7px + env(safe-area-inset-bottom,0px));z-index:7;display:none;padding:3px 6px;border-radius:5px;background:rgba(0,0,0,.48);color:#d7fbe6;font:10px/1.2 system-ui,sans-serif;pointer-events:none;text-shadow:0 1px 2px #000}
#mpPing.show{display:block}
#mpFullscreenBtn{position:fixed;z-index:8;top:calc(10px + env(safe-area-inset-top,0px));right:calc(114px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);font-size:23px;display:none;place-items:center;pointer-events:auto}
#mpFullscreenBtn.show{display:grid}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="wtr"></div><div id="hurt"></div><div id="flash"></div><div id="cross"></div>
  <div id="mineBar"><i></i></div><div id="tip"></div>
  <button class="round" id="invBtn" aria-label="Bag">🎒</button>
  <button class="round" id="menuBtn" aria-label="Menu">☰</button>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button class="act" id="bJump">Jump</button><button class="act" id="bDown" style="display:none">Down</button>
  <button class="act" id="bPlace">Place</button><button class="act" id="bBreak">Break</button>
  <div id="stats"><div id="hp"></div><div id="fd"></div></div>
  <div id="hot"></div>
</div>
<div id="mpNames"></div><div id="mpPing" aria-live="off">ping: --</div>
<button id="mpFullscreenBtn" type="button" aria-label="Fullscreen and landscape" title="Fullscreen / Landscape">⛶</button>
<div id="mpScreen">
  <div class="mpPanel">
    <h1>Block Worlds</h1>
    <div id="mpHomeView" class="mpCard" hidden style="box-sizing:border-box;width:100%;max-width:360px;padding:7px 10px;gap:7px;align-self:center">
      <p id="mpWelcome" class="mpWelcomeLine">Welcome!</p>
      <button class="mpBtn" id="mpCreateViewBtn"><span id="mpPlayLabel">Play Online</span></button>
    </div>
    <div id="mpRoomView" class="mpCard" hidden><h2 id="mpRoomTitle" style="margin:0"></h2></div>
    <div id="mpStatus" class="mpStatus" role="status"></div>
  </div>
</div>
<div id="mpPlayersHud"></div>
<div id="load" class="show"><h1 style="margin:0">Block Worlds</h1><div id="loadMsg">Loading…</div><div id="bar"><i></i></div></div>
<div id="menu"><div class="panel">
  <h1>Block Worlds</h1>
  <button class="mb" id="mResume">▶ Resume</button>
  <button class="mb alt" id="customHudBtn">🎛 Custom HUD</button>
  <button class="mb alt" id="mSave">💾 Save Game</button>
  <button class="mb alt" id="mSet">⚙ Settings</button>
</div></div>
<div id="set"><div class="panel">
  <h1>⚙ Settings</h1>
  <h2>Graphics</h2>
  <div class="seg" id="gfxSeg"><button data-g="0">Low</button><button data-g="1">Medium</button><button data-g="2">High</button></div>
  <h2>Look Sensitivity</h2>
  <input type="range" id="sensR" min="40" max="220" value="100">
  <button class="mb alt" id="sLefty">✋ Left-hand mode: Off</button>
  <button class="mb alt" id="sWeather">🌧 Weather: On</button>
  <button class="mb alt" id="sFest">🪁 Festivals: Auto</button>
  <button class="mb alt" id="sSnd">🔊 Sound: On</button>
  <h2>Save slot</h2>
  <div class="seg" id="slotSeg"><button data-s="1">1</button><button data-s="2">2</button><button data-s="3">3</button></div>
  <button class="mb" id="setClose">◀ Back</button>
</div></div>
<div id="inv"><div class="panel">
  <h1>🎒 Bag</h1>
  <button class="mb" id="invClose">▶ Resume</button>
  <p id="invHint"></p>
  <div class="grid" id="invGrid"></div>
  <div id="craftBox"><h2>Banao (Crafting)</h2><div id="craftList" style="display:flex;flex-direction:column;gap:8px;margin-top:6px"></div></div>
</div></div>
<div id="furn"><div class="panel">
  <h1>🔥 Furnace</h1>
  <p id="furnHint"></p>
  <div id="furnList" style="display:flex;flex-direction:column;gap:8px"></div>
  <button class="mb" id="furnClose">▶ Resume</button>
</div></div>
<div id="chest"><div class="panel">
  <h1>📦 Chest</h1>
  <h2>Chest (tap to move to bag)</h2>
  <div class="grid" id="chestGrid"></div>
  <h2>Your Bag (tap to move to chest)</h2>
  <div class="grid" id="chestInv"></div>
  <button class="mb" id="chestClose">▶ Resume</button>
</div></div>
<div id="dead"><div class="panel" style="align-items:center"><h1>💀 You Died</h1><p>Your items are safe. Respawn to continue.</p><button class="mb" id="respawn" style="width:100%">Respawn</button></div></div>

<script>
(function(){
  function show(m){var l=document.getElementById("load");if(!l)return;l.className="show";l.innerHTML="<h2 style='margin:0'>Error</h2><p style='font-size:12px;color:#ffb4b4'>"+String(m).slice(0,500)+"</p>"}
  window.addEventListener("error",function(e){show((e.message||"error")+" (line "+(e.lineno||"?")+")")});
  window.addEventListener("unhandledrejection",function(e){show(e.reason&&(e.reason.message||e.reason)||"error")});
})();
</script>

function hash(x,z,s){let h=Math.imul(x,374761393)+Math.imul(z,668265263)+Math.imul(s,982451653)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,z,s){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=hash(xi,zi,s),b=hash(xi+1,zi,s),c=hash(xi,zi+1,s),d=hash(xi+1,zi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,z,s){let a=0,amp=.5,f=1,n=0;for(let i=0;i<4;i++){a+=vnoise(x*f,z*f,s+i*31)*amp;n+=amp;amp*=.5;f*=2}return a/n}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const IDX=function(x,y,z){return x+W*(z+D*y)};
function get(x,y,z){if(x<0||z<0||y<0||x>=W||z>=D||y>=H)return AIR;return blocks[x+W*(z+D*y)]}

const inVil=function(x,z,m){return VIL&&x>=VIL.cx-22-m&&x<VIL.cx+22+m&&z>=VIL.cz-22-m&&z<VIL.cz+22+m};

const ANCH=[{x:64,z:64,b:0},{x:66,z:14,b:0},{x:62,z:114,b:0},{x:22,z:18,b:4},{x:110,z:22,b:2},{x:110,z:100,b:1},{x:16,z:92,b:3}];
function biomeAt(x,z){
  const wx=x+(fbm(x*.03,z*.03,seed+500)-.5)*44,wz=z+(fbm(x*.03+50,z*.03+50,seed+501)-.5)*44;
  let best=0,bd=1e9;
  for(let i=0;i<ANCH.length;i++){const a=ANCH[i],dx=wx-a.x,dz=wz-a.z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=a.b}}
  return best;
}
function genTerrain(){
  blocks.fill(0);meta.fill(0);
  for(let z=0;z<D;z++)for(let x=0;x<W;x++){
    const b=biomeAt(x,z);bio[x+W*z]=b;
    const n1=fbm(x*0.02,z*0.02,seed),n2=fbm(x*0.06+100,z*0.06+100,seed+7);
    let h;
    if(b===1)h=Math.floor(SEA+3+(n1-.5)*12+(n2-.5)*5);
    else if(b===2)h=SEA+2;
    else if(b===4)h=Math.floor(16+n1*30+(n2-.5)*8);
    else h=Math.floor(12+n1*20+(n2-0.5)*6);
    const rv=Math.abs(fbm(x*0.025+500,z*0.025+500,seed+9)-.5);
    const canRiver=b!==2&&b!==4;
    if(canRiver&&rv<.026)h=Math.min(h,SEA-2);
    h=Math.max(3,Math.min(H-10,h));
    hm[x+W*z]=h;
    const beach=h<=SEA+1||(canRiver&&rv<.05&&h<=SEA+3);
    for(let y=0;y<=h;y++){
      let id;
      if(y<h-3)id=STONE;
      else if(y<h)id=(b===1||b===2||beach)?SAND:DIRT;
      else id=b===2?SALT:(b===1||beach)?SAND:(b===4&&h>=SEA+3)?SNOW:GRASS;
      blocks[IDX(x,y,z)]=id;
    }
    for(let y=h+1;y<=SEA;y++)blocks[IDX(x,y,z)]=WATER;
  }
}

    if(i>=list.length){done();return}
    onProg(i,list.length,list[i][0]);

  })();
}
function pickVillage(){
  let best=null,bs=1e9;
  for(let cz=34;cz<=94;cz+=6)for(let cx=34;cx<=94;cx+=6){
    let mn=99,mx=0,sum=0,n=0,pen=0;
    for(let dz=-22;dz<=22;dz+=4)for(let dx=-22;dx<=22;dx+=4){
      const ix=(cx+dx)+W*(cz+dz),h=hm[ix];mn=Math.min(mn,h);mx=Math.max(mx,h);sum+=h;n++;
      if(bio[ix]!==0&&bio[ix]!==3)pen+=6;if(h<SEA+2)pen+=6;
    }
    const mean=sum/n,score=(mx-mn)*3+Math.abs(cx-64)*.05+Math.abs(cz-64)*.05+(mean<SEA+3?20:0)+pen;
    if(score<bs){bs=score;best={cx:cx,cz:cz,y0:Math.round(mean)}}
  }
  best.y0=Math.max(SEA+3,Math.min(26,best.y0));
  return best;
}
function flattenVillage(){
  const cx=VIL.cx,cz=VIL.cz,y0=VIL.y0;
  for(let z=cz-22;z<cz+22;z++)for(let x=cx-22;x<cx+22;x++){
    for(let y=y0+1;y<H;y++)blocks[IDX(x,y,z)]=AIR;
    for(let y=0;y<=y0;y++){
      const i=IDX(x,y,z);let b=blocks[i];
      if(y<y0-3){if(b===AIR||b===WATER)b=STONE}
      else if(y<y0)b=DIRT;else b=GRASS;
      blocks[i]=b;
    }
    hm[x+W*z]=y0;bio[x+W*z]=0;
  }
}
function carveCaves(){
  const rnd=rng(seed*7+13);
  for(let w=0;w<70;w++){
    let x=rnd()*W,z=rnd()*D;const hh=hm[Math.floor(x)+W*Math.floor(z)];
    const fromTop=(w%3===0&&hh>SEA+2);
    let y=fromTop?hh:6+rnd()*Math.max(1,hh-12);
    let yaw=rnd()*6.283,pit=fromTop?-0.55:(rnd()-.5)*.6;
    const len=60+rnd()*70,rad0=1.3+rnd()*1.1;
    for(let s=0;s<len;s++){
      x+=Math.cos(yaw)*Math.cos(pit);y+=Math.sin(pit);z+=Math.sin(yaw)*Math.cos(pit);
      yaw+=(rnd()-.5)*.55;pit+=(rnd()-.5)*.35;pit*=.93;pit=Math.max(-.7,Math.min(.7,pit));
      if(y<4)pit=Math.abs(pit)+.1;
      const rad=rad0*(0.8+0.4*rnd()),r2=rad*rad;
      const x0=Math.floor(x-rad),x1=Math.floor(x+rad),y0=Math.floor(y-rad),y1=Math.floor(y+rad),z0=Math.floor(z-rad),z1=Math.floor(z+rad);
      for(let bz=z0;bz<=z1;bz++)for(let bx=x0;bx<=x1;bx++){
        if(bx<1||bz<1||bx>=W-1||bz>=D-1||hm[bx+W*bz]<=SEA+1||inVil(bx,bz,3))continue;
        for(let by=Math.max(2,y0);by<=y1&&by<H;by++){
          const dx=bx+.5-x,dy=by+.5-y,dz=bz+.5-z;
          if(dx*dx+dy*dy+dz*dz>r2)continue;
          const i=IDX(bx,by,bz),b=blocks[i];
          if(b===STONE||b===DIRT||b===GRASS||b===SAND||b===SNOW||b===SALT)blocks[i]=AIR;
        }
      }
    }
  }
}
function placeOres(){

    for(let n=0;n<count;n++){
      let x=Math.floor(rnd()*W),z=Math.floor(rnd()*D);
      const top=Math.min(ymax,hm[x+W*z]-3);if(top<=ymin)continue;

function leafAt(X,Y,Z){if(X>=0&&X<W&&Z>=0&&Z<D&&Y>=0&&Y<H&&blocks[IDX(X,Y,Z)]===AIR)blocks[IDX(X,Y,Z)]=LEAF}
function makeTree(x,z,h,kind){
  if(kind===0){
    const tr=4+Math.floor(hash(x,z,seed+5)*2),top=h+tr;
    for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
      if(Math.abs(dx)===2&&Math.abs(dz)===2&&dy!==1)continue;
      if(dy===1&&(Math.abs(dx)>1||Math.abs(dz)>1))continue;
      leafAt(x+dx,top+dy,z+dz);
    }
    for(let y=h+1;y<=top;y++)blocks[IDX(x,y,z)]=WOOD;
  }else if(kind===1){
    const tr=6+Math.floor(hash(x,z,seed+5)*3),top=h+tr;
    for(let dy=-2;dy<=1;dy++){const r=dy===1?1:dy===0?3:2;
      for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){if(dx*dx+dz*dz>r*r+1)continue;leafAt(x+dx,top+dy,z+dz)}}
    for(let y=h+1;y<=top;y++)blocks[IDX(x,y,z)]=WOOD;
  }else{
    const tr=5+Math.floor(hash(x,z,seed+5)*3),top=h+tr,rs=[0,1,1,2,2];
    for(let k=0;k<rs.length;k++){const r=rs[k];
      for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){if(Math.abs(dx)+Math.abs(dz)>r+1)continue;leafAt(x+dx,top+1-k,z+dz)}}
    for(let y=h+1;y<=top;y++)blocks[IDX(x,y,z)]=WOOD;
  }
}
function placeTrees(){
  for(let z=3;z<D-3;z++)for(let x=3;x<W-3;x++){
    const b=bio[x+W*z];if(b===1||b===2)continue;
    const p=b===3?0.05:b===4?0.02:0.013;
    if(hash(x,z,seed+99)>=p||inVil(x,z,2))continue;
    let h=H-1;while(h>0&&blocks[IDX(x,h,z)]===AIR)h--;
    const top=blocks[IDX(x,h,z)];
    if(b===4){if(top!==SNOW&&top!==GRASS)continue;makeTree(x,z,h,2)}
    else{if(top!==GRASS)continue;makeTree(x,z,h,b===3?1:0)}
  }
}
function placeDecor(){
  for(let z=1;z<D-1;z++)for(let x=1;x<W-1;x++){
    const h=hm[x+W*z];
    if(blocks[IDX(x,h,z)]!==GRASS||blocks[IDX(x,h+1,z)]!==AIR)continue;
    const r=hash(x,z,seed+3),jg=bio[x+W*z]===3;
    if(r<(jg?0.16:0.06))put(x,h+1,z,TUFT);else if(r<(jg?0.164:0.068))put(x,h+1,z,FLR);else if(r<(jg?0.17:0.077))put(x,h+1,z,FLY);
  }
}
function buildVillage(){

function lampPost(x,z,y0){put(x,y0+1,z,WOOD);put(x,y0+2,z,WOOD);put(x,y0+3,z,WOOD);put(x,y0+4,z,LAMP)}

function mandir(cx,zf,y0){

function house(x0,z0,w,d,side,wall,y0,withFurnace){

}
function farm(x0,z0,w,d,y0){

const joyZone=e=>prefs.lefty?e.clientX>innerWidth*0.55:e.clientX<innerWidth*0.45;
canvas.addEventListener("pointerdown",e=>{
  ac();

    if(menuOpen)return;
    if(document.pointerLockElement!==canvas){canvas.requestPointerLock&&canvas.requestPointerLock();return}
    if(e.button===0){input.brk=true}else if(e.button===2){input.plc=true;plcCd=0;plcEdge=true}
    return;
  }
  if(menuOpen)return;
  if(joyZone(e)&&joyId===null){
    joyId=e.pointerId;joyO=[e.clientX,e.clientY];
    joyBase.style.left=(e.clientX-60)+"px";joyBase.style.bottom=(innerHeight-e.clientY-60)+"px";
  }else if(lookId===null){lookId=e.pointerId;lookLast=[e.clientX,e.clientY]}
  canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(e.pointerType==="mouse")return;
  if(e.pointerId===joyId){
    let dx=e.clientX-joyO[0],dy=e.clientY-joyO[1];const m=Math.hypot(dx,dy),R=48;
    if(m>R){dx=dx/m*R;dy=dy/m*R}
    joyKnob.style.left=(32+dx)+"px";joyKnob.style.top=(32+dy)+"px";
    const nx=dx/R,ny=dy/R;input.jx=Math.abs(nx)<.12?0:nx;input.jy=Math.abs(ny)<.12?0:ny;
  }else if(e.pointerId===lookId){
    const s=0.0058*prefs.sens;
    P.yaw-=(e.clientX-lookLast[0])*s;P.pitch-=(e.clientY-lookLast[1])*s;
    P.pitch=Math.max(-1.55,Math.min(1.55,P.pitch));lookLast=[e.clientX,e.clientY];
  }
});

  $('#mpWelcome').innerHTML='';const label=document.createElement('span');label.className='mpWelcomeLabel';label.textContent='Welcome,';const w=document.createElement('span');w.className='mpUserName';w.textContent=mp.name||'Player';const edit=document.createElement('button');edit.className='mpEditName';edit.type='button';edit.title='Change name';edit.setAttribute('aria-label','Change name');edit.textContent='✎';edit.onclick=()=>{const n=window.prompt('Change your name',mp.name||'Player');if(n===null)return;const v=n.trim().slice(0,20);if(!v)return;mp.name=v;try{localStorage.setItem('bd_mp_name',v)}catch(e){}mpOpenHome();if(mp.started)mpSend({type:'player:move',position:{x:P.x,y:P.y,z:P.z,yaw:P.yaw,pitch:P.pitch,moving:false}})};$('#mpWelcome').append(label,w,edit);
}
async function mpPlaySolo(){
  if(mp.connecting)return;mp.connecting=true;mpStatus('__connecting__');$('#mpCreateViewBtn').disabled=true;$('#mpCreateViewBtn').style.opacity='.75';
  try{
    if(mp.ws&&mp.ws.readyState===WebSocket.OPEN){mp.ws.close()}
    const scheme=location.protocol==='https:'?'wss://':'ws://';
    const wsUrl=scheme+location.host+'/ws';
    const ws=new WebSocket(wsUrl);mp.ws=ws;
    ws.addEventListener('open',()=>{
      ws.send(JSON.stringify({type:'join',name:(mp.name||'Player').slice(0,20)}));
    });
    ws.addEventListener('message',ev=>{
      let msg;try{msg=JSON.parse(ev.data)}catch{return}
      if(msg.type==='welcome'){
        mp.playerId=msg.id;mp.roomCode='global';mp.host=!!msg.host;mp.started=false;
        mp.worldReady=false;mp.pendingBlocks={};mp.remote={};
        mp.room={code:'global',seed:msg.seed,status:'playing',players:[]};
        mp.room.players=(msg.players||[]).map(p=>({id:p.id,name:p.name,position:p.position,online:true}));
        (msg.players||[]).forEach(p=>{if(p.id!==mp.playerId)mp.remote[p.id]={position:p.position||null,target:p.position||null,moving:false}});
        mpRenderPlayersHud();
        mpStartSharedWorld(msg.seed,msg.blocks||{});
        mpStartPing();
        mpStatus('');
        ws.send(JSON.stringify({type:'player:move',position:{x:P.x,y:P.y,z:P.z,yaw:P.yaw,pitch:P.pitch,moving:false}}));
      }else if(msg.type==='players'){
        const rem={};const list=[];
        (msg.players||[]).forEach(p=>{
          list.push({id:p.id,name:p.name||'Player',position:p.position||null,online:true});
          if(p.id!==mp.playerId){const old=mp.remote[p.id]||{};const target=p.position||old.target;rem[p.id]={...old,target,position:old.position||target||null,moving:!!(old.position&&target&&Math.hypot((target.x||0)-(old.position.x||0),(target.y||0)-(old.position.y||0),(target.z||0)-(old.position.z||0))>.025)}}
        });
        mp.remote=rem;mp.room=mp.room||{code:'global',players:[]};mp.room.players=list;mpRenderPlayersHud();
      }else if(msg.type==='player:move'){
        if(msg.id&&msg.id!==mp.playerId){const old=mp.remote[msg.id]||{};mp.remote[msg.id]={...old,target:msg.position,position:old.position||msg.position,moving:!!msg.position?.moving};}
      }else if(msg.type==='block:set'){
        if(msg.block){const b=msg.block;if(mp.worldReady)mpApplyBlock(b);else mp.pendingBlocks[[b.x,b.y,b.z].join(',')]=b}
      }else if(msg.type==='pong'){mp.ping=Math.max(0,Math.round(performance.now()-msg.t));const el=$('#mpPing');el.textContent='ping: '+mp.ping+' ms';el.style.color=mp.ping<100?'#d7fbe6':mp.ping<220?'#ffe4a3':'#ffb4b4'}
      else if(msg.type==='error'){mpStatus(msg.message||'Server error')}
    });
    ws.addEventListener('error',()=>mpStatus('Server connection failed. Start the Termux server and open this page through its URL.'));
    ws.addEventListener('close',()=>{if(mp.ws===ws){mpStatus('Disconnected from server.');$('#mpPing').classList.remove('show')}});
  }catch(e){mpStatus('Could not connect: '+e.message)}
  finally{mp.connecting=false;$('#mpCreateViewBtn').disabled=false;$('#mpCreateViewBtn').style.opacity='1'}
}
function mpApplyZombieSnapshot(list){
  const existing=new Map(mobs.filter(m=>m.type==='zombie').map(m=>[m.syncId,m]));const keep=new Set();
  for(const d of list){if(!d||!d.syncId)continue;keep.add(d.syncId);let m=existing.get(d.syncId);if(!m){m=newMob('zombie',Number(d.x)||0,Number(d.y)||0,Number(d.z)||0);m.syncId=d.syncId}const tx=Number(d.x)||0,ty=Number(d.y)||0,tz=Number(d.z)||0;m.syncTarget={x:tx,y:ty,z:tz,yaw:Number(d.yaw)||0};if(!m.positioned){m.x=tx;m.y=ty;m.z=tz;m.positioned=true}m.hp=Number(d.hp)||1;m.moving=!!d.moving;m.ph=Number(d.ph)||0;m.angry=!!d.angry;}
  for(const m of mobs.slice())if(m.type==='zombie'&&m.syncId&&!keep.has(m.syncId))mobs.splice(mobs.indexOf(m),1);
}
function mpSend(data){
  if(!mp.ws||mp.ws.readyState!==WebSocket.OPEN||!mp.started)return;
  if(data?.type==='player:move'){
    const now=Date.now();if(now-(mp.lastMoveWrite||0)<70)return;mp.lastMoveWrite=now;
    mp.ws.send(JSON.stringify({type:'player:move',position:data.position}));
  }else if(data?.type==='block:set'){
    const b=data.block;if(!b)return;
    mp.ws.send(JSON.stringify({type:'block:set',block:{x:b.x,y:b.y,z:b.z,id:b.id,meta:b.meta||0}}));
  }
}
function mpSaveZombieState(){ /* Zombie snapshots are not persisted by this lightweight server. */ }
function mpCleanup(){
  if(mp.pingTimer){clearInterval(mp.pingTimer);mp.pingTimer=null}
  $('#mpPing').classList.remove('show');
  if(mp.ws){try{mp.ws.close()}catch{}mp.ws=null}
}
function mpApplyBlock(b){if(!b||![b.x,b.y,b.z,b.id].every(Number.isFinite))return;mp.applyingRemote=true;try{setBlock(Math.trunc(b.x),Math.trunc(b.y),Math.trunc(b.z),Math.trunc(b.id),true,Math.trunc(b.meta||0))}finally{mp.applyingRemote=false}}
function mpStartSharedWorld(sharedSeed,blockChanges){if(mp.started)return;mp.started=true;mpUpdateFullscreenButton();$('#mpScreen').hidden=true;$('#mpPing').classList.add('show');mpStatus('');menuOpen=true;seed=Number(sharedSeed)||1;resetNewGame();seed=Number(sharedSeed)||1;edits=new Map();chests.clear();const stages=genStages().concat([['Shared world edits apply হচ্ছে…',()=>{mp.applyingRemote=true;try{Object.entries(blockChanges||{}).forEach(([key,val])=>{const a=key.split(',').map(Number);if(a.length!==3)return;const b=typeof val==='number'?{id:val,meta:0}:val;setBlock(a[0],a[1],a[2],Number(b.id)||0,true,Number(b.meta)||0)})}finally{mp.applyingRemote=false};finishWorld()}]]);runStages(stages,(i,n,msg)=>setLoad(i/n*0.5,msg),()=>{newGamePost();buildAll(()=>{ mp.worldReady=true;Object.values(mp.pendingBlocks).forEach(mpApplyBlock);mp.pendingBlocks={};$('#mpScreen').hidden=true;menuOpen=false;mpStatus('');tip('Online match connected')})})}
function mpStartPing(){
  if(mp.pingTimer)clearInterval(mp.pingTimer);
  const el=$('#mpPing');el.classList.add('show');el.textContent='ping: --';
  const measure=()=>{if(!mp.started||!mp.ws||mp.ws.readyState!==WebSocket.OPEN)return;mp.ws.send(JSON.stringify({type:'ping',t:performance.now()}))};
  measure();mp.pingTimer=setInterval(measure,2000);
}
function mpRenderPlayersHud(){const h=$('#mpPlayersHud');h.style.display='none';/* world-space name tags are rendered above each remote player */}
function mpDisconnect(){if(mp.pingTimer){clearInterval(mp.pingTimer);mp.pingTimer=null}$('#mpPing').classList.remove('show');if(mp.ws){try{mp.ws.close()}catch{}mp.ws=null}mp.roomCode='';mp.playerId='';mp.host=false;mp.started=false;mpUpdateFullscreenButton();mp.remote={};$('#mpPlayersHud').style.display='none';}

function mpStartSoloLocal(){
  // The world is already loaded by start(); Start Online should enter it immediately
  // without any external database; multiplayer is handled by the local WebSocket server.
  if(mp.connecting)mp.connecting=false;
  $('#mpScreen').hidden=true;
  $('#mpStatus').textContent='';
  $('#mpPing').classList.remove('show');
  menuOpen=false;
  if(!ready){showLoad('Loading world…');}
}
$('#mpCreateViewBtn').addEventListener('click',function(e){e.preventDefault();e.stopPropagation();mpPlaySolo()});
$('#mpMyWorldsBtn')?.remove();
$('#mpLeaveRoom')?.addEventListener('click',()=>{mpCleanup();mpDisconnect();mpOpenHome()});
mpLoadLocal();if(!mp.name){mp.name='Player';try{localStorage.setItem('bd_mp_name',mp.name)}catch(e){}}menuOpen=true;mpOpenHome();
window.addEventListener('pagehide',mpCleanup);
const mpFullscreenBtn=$('#mpFullscreenBtn');
function mpUpdateFullscreenButton(){mpFullscreenBtn.classList.toggle('show',!!mp.started);}
async function mpEnterFullscreenLandscape(){
  try{
    const root=document.documentElement;
    if(!document.fullscreenElement){
      if(root.requestFullscreen)await root.requestFullscreen();
      else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();
    }
    if(screen.orientation&&screen.orientation.lock){
      try{await screen.orientation.lock('landscape')}catch(e){}
    }
    mpFullscreenBtn.textContent='⛶';
  }catch(e){mpStatus('Fullscreen is not supported by this browser.');}
}
mpFullscreenBtn.addEventListener('click',mpEnterFullscreenLandscape);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&screen.orientation&&screen.orientation.unlock){try{screen.orientation.unlock()}catch(e){}}});

/* ================= MAIN LOOP ================= */
let last=performance.now(),mining=null,growT=0,festT=0;
function mineStep(dt){
  const bar=$("#mineBar");
  atkCd-=dt;
  if(!input.brk){mining=null;bar.style.display="none";return}
  if(mobT&&(!target||mobT.t<target.dist)){
    mining=null;bar.style.display="none";
    if(atkCd<=0){hitMob(mobT.m,attackDmg());atkCd=0.45}
    return;
  }
  if(!target||target.y<=0){mining=null;bar.style.display="none";return}
  const id=get(target.x,target.y,target.z);
  if(id===AIR||id===WATER){mining=null;bar.style.display="none";return}
  if(!mining||mining.x!==target.x||mining.y!==target.y||mining.z!==target.z)mining={x:target.x,y:target.y,z:target.z,p:0,t:0};
  const hard=HARD[id]||1,speed=creative?1e6:breakSpeed(id);
  mining.p+=dt*speed/hard;mining.t+=dt;
  if(mining.t>0.28&&!creative){mining.t=0;SFX.hit()}
  bar.style.display=creative?"none":"block";bar.firstElementChild.style.width=Math.min(100,mining.p*100)+"%";
  if(mining.p>=1){breakBlock(target.x,target.y,target.z,true);SFX.brk();mining=null;bar.style.display="none"}
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;last=now;
  if(!ready)return;
  if(!menuOpen){
    update(dt);
    dayT+=dt/DAY_LEN;if(dayT>=1){dayT-=1;dayCount++}
    gameT+=dt*(1+rainVis);
    target=raycast(heldItem()===BUCKET);mobT=mobTarget();
    $("#cross").classList.toggle("mob",!!mobT);
    mineStep(dt);
    if(input.plc){
      if(plcEdge){doUse(true);plcEdge=false;plcCd=0.35}
      else{plcCd-=dt;if(plcCd<=0){doUse(false);plcCd=0.26}}
    }
    manageMobs(dt);
    weatherUpdate(dt);
    festT-=dt;
    if(festT<=0){festT=1;const f=festNow();if(f!==festCur){festCur=f;if(f==="utt")tip("Kai po chhe! 🪁 Uttarayan");else if(f==="diw")tip("Shubh Deepavali! 🪔")}
      kitesOn=festCur==="utt"&&dayK()>0.4;fwOn=festCur==="diw"&&dayK()<0.45}
    if(kitesOn)updateKites(dt);
    updateFireworks(dt,fwOn);
    growT-=dt;
    if(growT<=0){growT=1;wheat.forEach((t,i)=>{if(gameT>=t){const m=meta[i];
      if(m<3){const x=i%W,tt=(i/W)|0,z=tt%D,y=(tt/D)|0;setBlock(x,y,z,WHEAT,true,m+1)}
      wheat.set(i,gameT+growDelay())}})}
    if(now-lastSave>20000)save();
  }
  if(mp.started && now-mp.lastMove>180){mp.lastMove=now;mpSend({type:'player:move',position:{x:P.x,y:P.y,z:P.z,yaw:P.yaw,pitch:P.pitch,moving:Math.hypot(P.vx||0,P.vz||0)>.08}});mpSaveZombieState()}
  if(mp.started){for(const r of Object.values(mp.remote)){if(!r.target){r.moving=false;continue}if(!r.position)r.position={...r.target};const gap=Math.hypot((r.target.x||0)-r.position.x,(r.target.y||0)-r.position.y,(r.target.z||0)-r.position.z);const a=Math.min(1,Math.max(.08,dt*(gap>2?15:10)));const ox=r.position.x,oz=r.position.z;r.position={x:ox+(r.target.x-ox)*a,y:r.position.y+(r.target.y-r.position.y)*a,z:oz+(r.target.z-oz)*a,yaw:r.target.yaw||0,pitch:r.target.pitch||0};const step=Math.hypot(r.position.x-ox,r.position.z-oz);r.moving=step>.0015;if(r.moving)r.ph=(r.ph||0)+dt*10}if(!mp.host)for(const m of mobs){if(m.type==='zombie'&&m.syncTarget){const a=Math.min(1,dt*5);m.x+=(m.syncTarget.x-m.x)*a;m.y+=(m.syncTarget.y-m.y)*a;m.z+=(m.syncTarget.z-m.z)*a;m.yaw=m.syncTarget.yaw||m.yaw}}}
  let n=0;for(let i=0;i<chunks.length&&n<3;i++){if(chunks[i].dirty){buildChunk(i);n++}}
  draw(now);
}

/* ================= START ================= */
function start(){
  loadPrefs();applyPrefs();
  showLoad("Loading…");
  enterWorld(()=>buildAll(()=>tip("Welcome to Block Worlds")));
  requestAnimationFrame(frame);
}
function boot(){try{start()}catch(err){fatal(err)}}
if(window.__BDTEST){window.__BD={input,P,mobs,inv,blocks,meta,blight,bio,hm,emitters,wheat,chests,prefs,get,getMeta,setBlock,newMob,toggleDoor,doUse,breakBlock,relight,dropsFor,
  state:()=>({hp,food,dead,creative,ready,VIL,panel,hotIdx,hotSlots,dayT,dayCount,rain,rainVis,kitesOn,fwOn,festCur,bedPt,slot}),
  set:(k,v)=>{if(k==="hp")hp=v;if(k==="food")food=v;if(k==="creative")creative=v;if(k==="dayT")dayT=v;if(k==="held"){hotSlots[hotIdx]=v}if(k==="rain"){rain=v;rainTarget=v}if(k==="dayCount")dayCount=v},
  setTarget:t=>{target=t},hurtPlayer,respawn,setPanel,renderInv,renderFurn,renderChest,RECIPES,SMELT,crafts:()=>RECIPES.map(canCraft),
  hitMob,killMob,save,loadSave,generate,finishWorld,buildChunk,chunks,mobTarget,raycast,groundY,solid,hitsBox,update,manageMobs,
  switchSlot,enterWorld,newGameData,resetNewGame,genStages,readSave,openChest,useBed,fw,kites,festNow,weatherUpdate,biomeAt,hash,dayK,applyPrefs}}
if(window.__BDTEST)boot();else{requestAnimationFrame(()=>setTimeout(boot,40))}
})();
